apiVersion: apps/v1
kind: Deployment

metadata:
  name: mydep1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: mycontainer
        image: nginx
        ports:
        - containerPort: 80
